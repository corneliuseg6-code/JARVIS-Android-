<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content makes Chrome shrink the layout viewport
     when the on-screen keyboard opens, so the chat bar stays above it instead
     of being covered. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, interactive-widget=resizes-content">
<meta name="theme-color" content="#04080f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS Android V2</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/jarvis.css">
</head>
<body>
<noscript class="noscript">JARVIS needs JavaScript enabled.</noscript>

<div id="app" class="app" data-view="home" data-power="active">

  <!-- ===================== top bar ===================== -->
  <header class="topbar">
    <button class="nav-toggle" id="btn-nav" type="button"
            data-i18n-aria="nav.menu" data-i18n-title="nav.menu" aria-expanded="false">
      <span class="nav-bars" aria-hidden="true"></span>
    </button>

    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" data-i18n="app.title">JARVIS</span>
    </div>

    <div class="activity-pill" id="activity-pill">
      <span class="activity-dot" aria-hidden="true"></span>
      <span id="activity-label" data-i18n="activity.idle">Standing by</span>
    </div>

    <button class="icon-btn" id="btn-open-settings" type="button"
            data-i18n-aria="settings.title" data-i18n-title="settings.title">⚙</button>
  </header>

  <!-- ===================== workspace =====================
       Top band: the instrument console — the rings centred, the status rail
       down the left, the control rail down the right, the hologram in the
       upper-right corner. Everything below it is conversation. -->
  <div class="workspace">

  <section class="console" id="console">

    <!-- ============ 3. status rail, down the left ============
         Filled by ui/status.js: SERVER, OLLAMA (the active brain), VOICE,
         TOOLS, VISION, one under the other. -->
    <div class="rail rail-left" id="status-chips" role="status" aria-live="polite"></div>

    <!-- ============ 1. avatar / hologram, upper right ============
         Its own WebGL surface, so the face can be on screen at the same time
         as the rings rather than instead of them. -->
    <section class="avatar-card" id="avatar-card">
      <canvas id="avatar-card-gl" class="avatar-canvas" aria-hidden="true"></canvas>
    </section>

    <!-- ============ 4. control rail, down the right ============ -->
    <div class="rail rail-right">
      <div class="mode-row" id="avatar-switch" role="group" data-i18n-aria="avatar.mode">
        <button type="button" class="mode-btn is-active" data-mode="rings" data-i18n="avatar.rings">Rings</button>
        <button type="button" class="mode-btn" data-mode="face" data-i18n="avatar.face">Face</button>
      </div>

      <button class="ctl ctl-mic is-muted" id="btn-mic" type="button" aria-pressed="false">
        <span class="ctl-dot" aria-hidden="true"></span>
        <span class="ctl-label" id="mic-label" data-i18n="mic.mute">Mute</span>
      </button>
      <button class="ctl ctl-power is-active" id="btn-power" type="button" aria-pressed="true">
        <span class="ctl-dot" aria-hidden="true"></span>
        <span class="ctl-label" id="power-label" data-i18n="power.active">Active</span>
      </button>

      <div class="fn-grid" id="fn-grid" role="group" data-i18n-aria="fn.group">
        <button class="fn" type="button" id="fn-eyes" data-fn="eyes" aria-pressed="false">
          <span class="fn-ico" aria-hidden="true">◉</span>
          <span class="fn-name" data-i18n="fn.eyes">Eyes</span>
          <span class="fn-state" data-i18n="common.off">Off</span>
        </button>
        <button class="fn" type="button" id="fn-watch" data-fn="watch" aria-pressed="false">
          <span class="fn-ico" aria-hidden="true">▣</span>
          <span class="fn-name" data-i18n="fn.watch">Watch</span>
          <span class="fn-state" data-i18n="common.off">Off</span>
        </button>
        <button class="fn" type="button" id="fn-holo" data-fn="holo" aria-pressed="false">
          <span class="fn-ico" aria-hidden="true">✦</span>
          <span class="fn-name" data-i18n="fn.holo">Holo</span>
          <span class="fn-state" data-i18n="common.off">Off</span>
        </button>
        <button class="fn" type="button" id="fn-focus" data-fn="focus" aria-pressed="false">
          <span class="fn-ico" aria-hidden="true">◎</span>
          <span class="fn-name" data-i18n="fn.focus">Focus</span>
          <span class="fn-state" data-i18n="common.off">Off</span>
        </button>
        <button class="fn" type="button" id="fn-reflex" data-fn="reflex" aria-pressed="false">
          <span class="fn-ico" aria-hidden="true">≋</span>
          <span class="fn-name" data-i18n="fn.reflex">Reflex</span>
          <span class="fn-state" data-i18n="common.off">Off</span>
        </button>
      </div>
    </div>

    <!-- ============ 2. the rings, centred ============
         Laid over the whole console and centred in it, so the dial can be
         wider than the gap between the rails — the rails sit on top of its
         outer crown, as in the reference. Last in source order so the rails
         keep the taps that belong to them. -->
    <main class="stage" id="stage">
      <!-- Two canvases: a canvas can hold only one kind of context, and RINGS
           is Canvas 2D while FACE is WebGL. Only the active one is shown. -->
      <canvas id="avatar-canvas" class="avatar-canvas" aria-hidden="true"></canvas>
      <canvas id="avatar-gl" class="avatar-canvas" aria-hidden="true" hidden></canvas>

      <div class="stage-tag" id="stage-tag" aria-hidden="true">RINGS</div>
      <button class="stage-exit" id="btn-immersive-exit" type="button" hidden
              data-i18n-aria="immersive.exit" data-i18n-title="immersive.exit">✕</button>
      <div class="stage-note" id="stage-note" hidden></div>

      <div class="standby-veil" id="standby-veil" hidden>
        <div class="standby-box">
          <div class="standby-title" data-i18n="power.standby">Standby</div>
          <p class="standby-text" data-i18n="power.inStandby"></p>
          <p class="standby-hint" data-i18n="power.resumeHint"></p>
          <button class="btn btn-primary" id="btn-resume" type="button" data-i18n="power.resume">Resume</button>
        </div>
      </div>
    </main>
  </section>

  <!-- ============ focus timer ============
       Between the console and the conversation, and only while a session
       runs: an idle timer would be exactly the wasted space this layout is
       meant to remove. -->
  <section class="focus-block" id="focus-block" hidden>
    <button class="focus-btn" id="btn-focus-pause" type="button"
            data-i18n-aria="fn.focusPause" data-i18n-title="fn.focusPause">❚❚</button>
    <span class="focus-time" id="focus-time">00:00</span>
    <button class="focus-btn" id="btn-focus-stop" type="button"
            data-i18n-aria="fn.focusStop" data-i18n-title="fn.focusStop">✕</button>
    <span class="focus-caption">
      <span class="focus-dot" aria-hidden="true"></span>
      <span data-i18n="fn.focus">Focus</span>
      <span class="focus-drift" id="focus-drift"></span>
    </span>
  </section>

  <!-- ============ 5. the conversation ============
       Always open, and the only thing that grows: it takes every pixel the
       console and the chat bar do not need. -->
  <section class="chat-panel" id="chat-panel">
    <div class="chat-head">
      <button class="btn btn-ghost btn-sm" id="btn-history" type="button" data-i18n="chat.history">History</button>
      <button class="btn btn-ghost btn-sm" id="btn-new-chat" type="button" data-i18n="chat.new">New</button>
    </div>

    <div class="messages" id="messages" aria-live="polite">
      <p class="empty" data-i18n="chat.empty"></p>
    </div>
    <div class="history-list" id="history-list" hidden></div>
  </section>

  </div><!-- /workspace -->

  <!-- ===================== 6/7. the chat bar, and nothing else ========= -->
  <section class="dock" id="dock" data-panel="chat">
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="chat-input" rows="1" data-i18n-placeholder="chat.placeholder"></textarea>
      <button class="round round-send" id="btn-send" type="submit"
              data-i18n-aria="chat.send" data-i18n-title="chat.send">➤</button>
      <button class="round round-stop" id="btn-stop" type="button" hidden
              data-i18n-aria="chat.stop" data-i18n-title="chat.stop">■</button>
    </form>
  </section>

  <!-- ===================== left drawer ===================== -->
  <div class="scrim" id="scrim" hidden></div>

  <nav class="drawer" id="drawer" aria-label="JARVIS" aria-hidden="true">
    <div class="drawer-head">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name" data-i18n="app.title">JARVIS</div>
        <div class="brand-sub" data-i18n="app.subtitle">Android V2</div>
      </div>
      <button class="icon-btn" id="btn-nav-close" type="button" data-i18n-aria="common.close">✕</button>
    </div>

    <button class="menu-btn is-active" type="button" data-view="home">
      <span class="menu-ico" aria-hidden="true">◈</span><span data-i18n="nav.home">Home</span>
    </button>
    <button class="menu-btn" type="button" data-view="armory">
      <span class="menu-ico" aria-hidden="true">⬡</span><span data-i18n="nav.armory">Tool Armory</span>
    </button>
    <button class="menu-btn" type="button" data-view="eyes">
      <span class="menu-ico" aria-hidden="true">◉</span><span data-i18n="nav.eyes">Eyes</span>
    </button>
    <button class="menu-btn" type="button" data-view="settings">
      <span class="menu-ico" aria-hidden="true">⚙</span><span data-i18n="nav.settings">Settings</span>
    </button>

    <div class="drawer-sep"></div>

    <label class="lang-picker" data-i18n-title="settings.uiLanguage">
      <span class="lang-globe" aria-hidden="true">◍</span>
      <select id="lang-quick" data-i18n-aria="settings.uiLanguage"></select>
    </label>

    <div class="magnifier" id="magnifier" data-i18n-title="magnifier.label">
      <svg class="mag-wedge" viewBox="0 0 160 34" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="magGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0e3d57"/>
            <stop offset="100%" stop-color="#36e6ff"/>
          </linearGradient>
        </defs>
        <polygon class="mag-wedge-fill" points="2,20 158,4 158,30 2,24" fill="url(#magGrad)"/>
        <polygon class="mag-wedge-line" points="2,20 158,4 158,30 2,24" fill="none"/>
      </svg>
      <input class="mag-range" id="mag-range" type="range" min="85" max="150" step="5" value="100"
             data-i18n-aria="magnifier.label">
      <span class="mag-glyph" aria-hidden="true">⌕</span>
      <span class="mag-value" id="mag-value">100%</span>
      <button class="mag-reset" id="mag-reset" type="button"
              data-i18n-title="magnifier.reset" data-i18n-aria="magnifier.reset">↺</button>
    </div>

    <div class="drawer-foot">
      <button class="btn btn-danger btn-sm" id="btn-exit" type="button" data-i18n="power.exit">Exit</button>
    </div>
  </nav>

  <!-- ===================== sheets ===================== -->
  <section class="sheet" id="sheet" hidden>
    <div class="sheet-head">
      <h2 id="sheet-title">—</h2>
      <button class="icon-btn" id="btn-sheet-close" type="button" data-i18n-aria="common.close">✕</button>
    </div>

    <div class="sheet-body">
      <div class="panel panel-armory" data-panel="armory" hidden>
        <div class="panel-head">
          <p class="panel-sub" data-i18n="armory.subtitle"></p>
          <button class="btn btn-primary btn-sm" id="btn-add-conn" type="button" data-i18n="armory.add">Add</button>
        </div>
        <div class="conn-list" id="conn-list"></div>
        <div class="conn-form" id="conn-form" hidden></div>
      </div>

      <div class="panel panel-eyes" data-panel="eyes" hidden>
        <div class="panel-head">
          <span class="cam-indicator" id="cam-indicator" hidden>
            <span class="cam-dot" aria-hidden="true"></span><span data-i18n="eyes.on">Camera on</span>
          </span>
        </div>
        <div class="cam-wrap">
          <video id="cam-video" playsinline muted autoplay></video>
          <div class="cam-off" id="cam-off" data-i18n="eyes.off">Camera off</div>
        </div>
        <div class="cam-controls">
          <button class="btn btn-primary btn-sm" id="btn-cam-start" type="button" data-i18n="eyes.start">Start</button>
          <button class="btn btn-danger btn-sm" id="btn-cam-stop" type="button" hidden data-i18n="eyes.stop">Stop</button>
          <button class="btn btn-ghost btn-sm" id="btn-cam-switch" type="button" hidden data-i18n="eyes.switch">Switch</button>
          <button class="btn btn-ghost btn-sm" id="btn-cam-describe" type="button" hidden data-i18n="eyes.describe">Describe</button>
        </div>
        <p class="cam-note" id="cam-note"></p>
        <div class="cam-result" id="cam-result" hidden></div>
      </div>

      <div class="panel panel-settings" data-panel="settings" hidden>
        <div class="panel-head">
          <span class="saved-flag" id="saved-flag" hidden data-i18n="settings.saved"></span>
        </div>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
